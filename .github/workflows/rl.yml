name: rl
on: pull_request
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install semgrep && semgrep scan --config p/python --sarif -o results.sarif . || true
      - uses: ./.github/actions/rl
        with:
          sarif: results.sarif
